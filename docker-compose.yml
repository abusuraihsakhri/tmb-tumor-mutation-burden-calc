services:
  tmb-tumor-mutation-burden-calc:
    build: .
    ports:
      - "8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY to a strong random value}
      AUDIT_API_TOKEN: ${AUDIT_API_TOKEN:?Set AUDIT_API_TOKEN to a strong random value}
    restart: unless-stopped
