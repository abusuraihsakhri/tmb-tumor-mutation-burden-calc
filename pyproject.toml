[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmb-tumor-mutation-burden-calc"
version = "3.0.0"
description = "Tumor Mutational Burden (TMB) Calculator with enterprise supervisor, PHI guard, and HMAC audit trail"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri", email = "noreply@commandcode.ai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.27"]
test = ["pytest>=8.0", "httpx>=0.27"]
dev = ["fastapi>=0.111", "uvicorn>=0.27", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
tmb-calc = "tmb_calc:main"

[tool.setuptools]
py-modules = ["tmb_calc", "cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_tmb_calc.py"]
python_files = ["test_*.py"]
addopts = "-v"
